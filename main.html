<!DOCTYPE html>
<html>
<head>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="styles.css">
	<style>
		.container {
			width: 600px;
			max-width: 600px;
			border: 5px solid rgb(4, 255, 4);
			background-color: rgb(41, 0, 0);
		}

		.container > .row {
			border: 5px solid rgb(255, 188, 188);
			height: 200px;
		}

		.row > div {
			border: 2px dotted rgb(38, 38, 43);
		}

		.row:nth-child(1) > div:nth-child(1) { background-color: teal; }
		.row:nth-child(1) > div:nth-child(2) { background-color: thistle; }

		.row:nth-child(2) > div:nth-child(1) { background-color: tomato; }
		.row:nth-child(2) > div:nth-child(2) { background-color: turquoise; }

		.row:nth-child(3) > div:nth-child(1) { background-color: violet; }
		.row:nth-child(3) > div:nth-child(2) { background-color: yellowgreen; }
	</style>
</head>
<body>

	<div class="container">

		<!-- Row 1: medium = col-md-4 (4/12 = 1/3) and col-md-8 (8/12 = 2/3); small = col-sm-6 each (equal halves) -->
		<div class="row">
			<div class="col-sm-6 col-md-4">Row1 col1</div>
			<div class="col-sm-6 col-md-8">Row1 col2</div>
		</div>

		<!-- Row 2: medium = each column is col-md-4 (1/3 width); column 1 is offset by 2 (offset-md-2); the empty space sits between the columns -->
		<div class="row justify-content-between">
			<div class="col-md-4 offset-md-2">Row2 col1</div>
			<div class="col-md-4">Row2 col2</div>
		</div>

		<!-- Row 3 -->
<div class="row justify-content-center justify-content-md-start">
	<div class="col-sm-6 col-md-4 offset-md-2">Row3 col1</div>
	<div class="col-sm-6 col-md-4">Row3 col2</div>
</div>

	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
